{# One line per enabled impairment: <pipe number> <delay ms or -> <loss fraction> #}
{% for item in helpers.toList('OPNsense.NetImpair.impairments.impairment') %}
{%   set pipe = helpers.getUUID(item.pipe) %}
{%   if item.enabled|default('0') == '1' and pipe.number|default('') != '' %}
{{ pipe.number }} {{ item.delay|default('-', true) }} {{ '%.4f'|format(item.loss|default('0', true)|float / 100) }}
{%   endif %}
{% endfor %}
