# pkg repository for the os-netimpair plugin. Copy to
# /usr/local/etc/pkg/repos/netimpair.conf on the OPNsense box; the plugin then
# shows up under System > Firmware > Plugins.
netimpair: {
  url: "https://github.com/lbockenstedt/opnsense/releases/download/netimpair-repo",
  signature_type: "none",
  priority: 5,
  enabled: yes
}
